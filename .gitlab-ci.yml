variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test
  - deploy
  - cleanup

# dev testing
dev-test:
  only:
    - dev
  stage: test
  tags:
    - deployment-master
  script:
    - set -e
    - python3 ommr4all-deploy/test.py

dev-cleanup:
  only:
    - dev
  stage: cleanup
  tags:
    - deployment-master
  script:
    - rm -rf *

# deploy master
master-test:
  only:
    - master
  stage: test
  tags:
    - deployment-master
  script:
    - set -e
    - python3 ommr4all-deploy/test.py

master-deploy:
  only:
    - master
  stage: deploy
  tags:
    - deployment-master
  script:
    - set -e
    - python3 ommr4all-deploy/deploy.py

master-cleanup:
  only:
    - master
  stage: cleanup
  tags:
    - deployment-master
  script:
    - rm -rf *

# deploy production
production-test:
  only:
    - tags
  stage: test
  tags:
    - deployment-production
  script:
    - set -e
    - python3 ommr4all-deploy/test.py

production-deploy:
  only:
    - tags
  stage: deploy
  tags:
    - deployment-production
  script:
    - set -e
    # --gpu-legacy pins a Pascal-compatible torch (sm_61, e.g. GTX 10xx); the
    # production host's GPU is a GTX 10xx, and plain --gpu (newest CUDA torch,
    # sm_61 dropped in torch 2.8) would not run on it.
    - python3 ommr4all-deploy/deploy.py --gpu-legacy

production-cleanup:
  only:
    - tags
  stage: cleanup
  tags:
    - deployment-production
  script:
    - rm -rf *
