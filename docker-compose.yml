# OMMR4all — all configuration comes from the .env file next to this file
# (see .env.example). Every variable below has a default, so `docker compose up`
# works even without a .env; `./start.sh` creates one from .env.example for you.
#
# Container-side paths (do not change): the host directories are chosen in .env
#   STORAGE  ->  /opt/ommr4all/storage    book/page data
#   DB_DIR   ->  /opt/ommr4all/db         SQLite database (defaults to STORAGE)

# Shared by the web (WSGI) and ws (ASGI) services — both are the same Django app
# and must agree on storage/database location and channel layer.
x-ommr4all-env: &ommr4all-env
  OMMR4ALL_STORAGE_ROOT: /opt/ommr4all/storage
  OMMR4ALL_DB_PATH: /opt/ommr4all/db/${DB_NAME:-db.sqlite3}
  # channel layer shared between the services so HTTP-triggered events reach websockets.
  # Overridable from .env only to point at an external Redis; both services must agree.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # reverse proxy / CSRF (see .env.example): needed so that form posts — above all the
  # /admin/ login — are accepted when a TLS terminating proxy sits in front of the app
  OMMR4ALL_TRUST_PROXY_HEADERS: ${OMMR4ALL_TRUST_PROXY_HEADERS:-1}
  OMMR4ALL_CSRF_TRUSTED_ORIGINS: ${OMMR4ALL_CSRF_TRUSTED_ORIGINS:-}

x-ommr4all-volumes: &ommr4all-volumes
  - ${STORAGE:-./storage}:/opt/ommr4all/storage
  # When DB_DIR is unset this is the same host directory as the storage mount,
  # i.e. the database lives at <STORAGE>/db.sqlite3 (the historical location).
  - ${DB_DIR:-${STORAGE:-./storage}}:/opt/ommr4all/db

services:
  web:
    image: ${OMMR4ALL_IMAGE:-uniwue/ommr4all}
    build:
      context: .
      # GPU_MODE=legacy (set by `start.sh --gpu-legacy`) bakes a Pascal-compatible
      # torch into the image; empty means the default build.
      args:
        GPU_MODE: ${GPU_MODE:-}
    restart: unless-stopped
    # Docker's default /dev/shm is 64 MB; torch DataLoader workers hand every batch
    # to the trainer through it (the end-to-end trainer falls back to 0 workers below 1 GB)
    shm_size: 2gb
    ports:
      - "${PORT:-8001}:8001"
    volumes: *ommr4all-volumes
    environment:
      <<: *ommr4all-env
      # optional superuser auto-creation on first start (see .env.example)
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      # set to 0 to skip the recursive storage permission fix on start
      FIX_STORAGE_PERMISSIONS: ${FIX_STORAGE_PERMISSIONS:-1}
      # which GPUs the task scheduler may use; empty = detect (see .env.example)
      OMMR4ALL_GPUS: ${OMMR4ALL_GPUS:-}
      # task scheduler tuning; all empty = the defaults in settings.py. Only the web
      # service runs the scheduler (it lives in the wsgi process), so ws does not need them.
      TASK_WORKER_IDLE_TIMEOUT: ${TASK_WORKER_IDLE_TIMEOUT:-600}
      TASK_WORKER_TERMINATE_TIMEOUT: ${TASK_WORKER_TERMINATE_TIMEOUT:-5}
      TASK_SCHEDULER_STALL_TIMEOUT: ${TASK_SCHEDULER_STALL_TIMEOUT:-60}
      TASK_MAX_RUNTIME: ${TASK_MAX_RUNTIME:-0}
      TASK_OPERATION_WATCHER_INTERVAL: ${TASK_OPERATION_WATCHER_INTERVAL:-30}
      # warn when saving one page takes longer than this (diagnoses slow storage)
      OMMR4ALL_SLOW_SAVE_SECONDS: ${OMMR4ALL_SLOW_SAVE_SECONDS:-}
      # output directory of the discovery CLI (container-side path)
      OMMR4ALL_DISCOVERY_OUT: ${OMMR4ALL_DISCOVERY_OUT:-}
      # how much of a training dataset to keep in memory before writing it to disk,
      # and where to write it; both empty = 40 % of the free RAM into the temp dir
      OMMR4ALL_DATASET_MEMORY_BUDGET_MB: ${OMMR4ALL_DATASET_MEMORY_BUDGET_MB:-}
      OMMR4ALL_DATASET_CACHE_DIR: ${OMMR4ALL_DATASET_CACHE_DIR:-}
      OMMR4ALL_LLM_MAX_PIXELS: ${OMMR4ALL_LLM_MAX_PIXELS:-}
      # optional LLM providers for the text_llm transcription step;
      # leave empty to offer only the local Chandra model in the client
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # accepted as an alias for GEMINI_API_KEY by the adapter and the batch tool
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # directories holding API key files instead of the keys above; container-side
      # paths, so the directory must be mounted in (see .env.example)
      GEMINI_API_KEY_DIR: ${GEMINI_API_KEY_DIR:-}
      OMMR4ALL_API_KEY_DIR: ${OMMR4ALL_API_KEY_DIR:-}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
  # daphne serves the ASGI/websocket side (/ws is proxied here by Apache);
  # mod_wsgi in the web service is WSGI-only and cannot speak websockets
  ws:
    image: ${OMMR4ALL_IMAGE:-uniwue/ommr4all}
    build:
      context: .
      args:
        GPU_MODE: ${GPU_MODE:-}
    restart: unless-stopped
    entrypoint: []
    working_dir: /opt/ommr4all/ommr4all-deploy/modules/ommr4all-server
    command: /opt/ommr4all/ommr4all-deploy-venv/bin/daphne -b 0.0.0.0 -p 8002 --proxy-headers ommr4all.routing:application
    environment:
      <<: *ommr4all-env
      DJANGO_SETTINGS_MODULE: ommr4all.settings
    volumes: *ommr4all-volumes
    depends_on:
      redis:
        condition: service_started
      web:
        # migrations are applied by the web entrypoint
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  test:
    image: ${OMMR4ALL_IMAGE:-uniwue/ommr4all}
    build: .
    profiles:
      - test
    entrypoint: []
    command: bash -c "cd /opt/ommr4all/ommr4all-deploy-src && python3 ommr4all-deploy/test.py"
