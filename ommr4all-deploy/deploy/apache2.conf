# This vhost speaks plain HTTP. When TLS is terminated by a proxy in front of it, that
# proxy must forward the original scheme and host, otherwise Django compares the browser's
# "Origin: https://<host>" against its own "http://<host>" and rejects every form post with
# "CSRF verification failed" (the admin login is where this shows up). Apache's mod_proxy
# sends X-Forwarded-Host but *not* X-Forwarded-Proto, so the fronting vhost needs:
#     ProxyPreserveHost On
#     RequestHeader set X-Forwarded-Proto "https"
# If that vhost is not yours, name the public origin instead, in /etc/apache2/envvars:
#     export OMMR4ALL_CSRF_TRUSTED_ORIGINS=https://your.host
# See the "Behind a TLS reverse proxy" section of the README.
Listen 8001
<VirtualHost *:8001>
        AllowEncodedSlashes On
        ErrorLog ${APACHE_LOG_DIR}/ommr4all-error.log
        CustomLog ${APACHE_LOG_DIR}/ommr4all-access.log combined

        # websockets are handled by the daphne ASGI service (compose service "ws");
        # on bare metal adjust the host to wherever daphne runs
        ProxyPass /ws ws://ws:8002/ws
        ProxyPassReverse /ws ws://ws:8002/ws

        WSGIPassAuthorization On
        # socket-timeout: book backups are streamed straight from disk and can run for many
        # minutes on a slow connection; without it mod_wsgi inherits Apache's 300s Timeout and
        # the client silently ends up with a truncated archive.
        # Do NOT add processes=: the task scheduler runs inside the wsgi process, a second one
        # would start a second TaskCreator loop and duplicate every task worker.
        WSGIDaemonProcess ommr4all python-home=/opt/ommr4all/ommr4all-deploy-venv python-path=/opt/ommr4all/ommr4all-deploy/modules/ommr4all-server lang=en_US.UTF-8 locale=en_US.UTF-8 socket-timeout=1800
        WSGIProcessGroup ommr4all
        WSGIApplicationGroup %{GLOBAL}

        Alias /static /opt/ommr4all/ommr4all-deploy/modules/ommr4all-server/static
        <Directory /opt/ommr4all/ommr4all-deploy/modules/ommr4all-server/static>
                Require all granted
        </Directory>

        WSGIScriptAlias / /opt/ommr4all/ommr4all-deploy/modules/ommr4all-server/ommr4all/wsgi.py
        <Directory /opt/ommr4all/ommr4all-deploy/modules/ommr4all-server/ommr4all>
                <Files wsgi.py>
                        Require all granted
                </Files>
        </Directory>
</VirtualHost>
